  - version: 4.32.26
    date: 2025-08-07
    changes:
      - text: |
          **[`CCEverywhere.TextToImageAppConfig.panelSettings`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#panelsettings)**: Added comprehensive panel settings configuration to allow fine-grained control over image generation parameters. They are available for both Generate Image v1 and v2 and include:
            - [`PanelSettings`](../../v4/shared/src/types/panel-settings-types/interfaces/panel-settings.md): Container interface for all panel settings.
            - [`StyleSetting`](../../v4/shared/src/types/panel-settings-types/interfaces/style-setting.md): Configuration for artistic styles with support for multiple style categories.
            - [`ContentTypeSetting`](../../v4/shared/src/types/panel-settings-types/interfaces/content-type-setting.md): Setting for content type selection (photo, graphic, art).
      - text: "**[`CCEverywhere.TextToImageAppConfig.hideFeedbackMenu`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#hidefeedbackmenu)**: Added option to hide feedback menu in header bar."
      - text: "**[`CCEverywhere.TextToImageAppConfig.isPromptSafe`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#ispromptsafe)**: Added a callback to check if a prompt is safe for image generation. This allows developers to implement their own additional prompt moderation logic."
      - text: |
          **[`CCEverywhere.TextToImageAppConfig.promptInputPlaceholder`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#promptinputplaceholder)**: Added placeholder text configuration for prompt input field (Generate Image v2 only).

          Both the [Generate Image tutorial](../tutorials/generate-image.md) and the [Concept Guide](../concepts/generate-image-v2.md) have been updated to reflect the new updates.
      - text: "Added comprehensive style enumerations to provide granular control over image generation aesthetics:"
      - text: "[`ImageContentType`](../../v4/shared/src/types/panel-settings-types/enumerations/image-content-type.md): Primary content types (photo, graphic, art)"
      - text: "[`ImageThemeStyle`](../../v4/shared/src/types/panel-settings-types/enumerations/image-theme-style.md): 15 artistic themes including concept art, pixel art, 3D, hyper-realistic, cartoon, and more"
      - text: "[`ImageTechniqueStyle`](../../v4/shared/src/types/panel-settings-types/enumerations/image-technique-style.md): 12 artistic techniques from painting and sketching to watercolor and linocut"
      - text: "`ImageLightingStyle`: five lighting options including backlighting, dramatic light, golden hour, studio light, and low lighting"
      - text: "`ImageCompositionStyle`: seven composition styles for camera angles and framing"
      - text: "[`ImageEffectStyle`](../../v4/shared/src/types/panel-settings-types/enumerations/image-effect-style.md): nine visual effects including bokeh, fisheye, neon, and bioluminescent"
      - text: "`ImageColorStyle`: six color palette options from black & white to vibrant and pastel colors"
      - text: "[`ImageMovementStyle`](../../v4/shared/src/types/panel-settings-types/enumerations/image-movement-style.md): 12 artistic movements including steampunk, synthwave, cyberpunk, and baroque"
      - text: "[`ImageMaterialStyle`](../../v4/shared/src/types/panel-settings-types/enumerations/image-material-style.md): nine material simulations from claymation to marble sculpture"
      - text: "[`ImageConceptStyle`](../../v4/shared/src/types/panel-settings-types/enumerations/image-concept-style.md): six conceptual moods for emotional tone"
      - text: "[`ImageStyleId`](../../v4/shared/src/types/panel-settings-types/type-aliases/image-style-id.md): Union type combining all available style options"
      - text: "**[`CCEverywhere.EditImageAppConfig.inlineTOUConsent`](../../v4/shared/src/types/module/app-config-types/interfaces/edit-image-app-config.md#inlinetouconsent)**: Added inline Terms of Use consent configuration."
      - text: "**[`PublishButtonGroup`](../../v4/shared/src/types/export-config-types/interfaces/publish-button-group.md)**: New publish button group interface for better export organization."

