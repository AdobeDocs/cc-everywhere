  - version: 4.29.22
    date: 2025-05-28
    changes:
      - text: |
          [**`CCEverywhere.module.editImage()`**](../../v4/sdk/src/workflows/3p/module-workflow/classes/module-workflow.md): Introduced a [new Edit Image v2 experience](../concepts/edit-image-v2.md), rearchitected to deliver significantly improved performance and a better user experience.

            **Key Features:**
            - **Reduced load times** in the range of 35% to 50%.
            - **Reduced memory consumption** by 35%.
            - **New modular UI** with improved user experience and implementation of the new Adobe Spectrum 2 design system.

            The new Edit Image v2 experience is available now, with no additional configuration required. Check out our [Edit Image v2](../concepts/edit-image-v2.md) page to learn more.
      - text: |
          [**`CCEverywhere.TextToImageAppConfig.communityWallConfig`**](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#properties): Added a new `communityWallConfig` property to allow host applications to **populate the Community Wall with custom images** instead of Firefly's default assets.

            Please refer to the [this section](../concepts/generate-image-v2.md#custom-community-wall) of the Generate Image v2 page for the implementation details.
      - text: |
          Two new properties to the `AppConfig` object to control "Show margins" and "Show bleed" behavior have been added:
            - [`CCEverywhere.EditorAppConfig.showPageMargin`](../../v4/shared/src/types/editor/app-config-types/interfaces/base-editor-app-config.md#properties)
            - [`CCEverywhere.EditorAppConfig.showBleedArea`](../../v4/shared/src/types/editor/app-config-types/interfaces/base-editor-app-config.md#properties)
      - text: "The PDF file type has been deprecated in the [`AppConfig.allowedFileTypes`](../../v4/shared/src/types/module/app-config-types/interfaces/edit-image-app-config.md#properties) property for the Edit Image v2 experience. If a PDF is passed anyway, it's converted to a PNG."
      - text: "Enhanced [Editor Customization](../concepts/appconfig.md) concept guide with configuration options (`assetCollection`, `showPageMargin`, `showBleedArea`), improved structure, comprehensive use cases and examples, and implementation guidance."

  - version: 4.28.19
    date: 2025-05-05
    changes:
      - text: "[`CCEverywhere.BaseEditorAppConfig.assetCollection`](../../v4/shared/src/types/editor/app-config-types/interfaces/base-editor-app-config.md#properties): A new optional `assetCollection` property (string, the collection's URN) has been added to allow asset collection to filtering support in the Editor."
      - text: "[`CCEverywhere.Callbacks.onIntentChange`](../../v4/shared/src/types/callbacks-types/interfaces/callbacks.md#properties): A new optional `onIntentChange` callback has been added to allow host applications to listen to the intent change event in the Editor; for example, when user navigates from one design workflow to another."
      - text: "Performance improvements and bug fixes."

  - version: 4.26.5
    date: 2025-04-11
    changes:
      - text: "[`CCEverywhere.BaseEditorAppConfig.analyticsData`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#properties): A new optional `analyticsData` property has been added to the `AppConfig` interface. This enables host applications to supply analytics-related information to the module. In particular, clients can specify the `hostAppTrigger` value to indicate the user action within the host application that launched the module (e.g., `add-image`, `replace-image`, `gmail`, etc.)."
      - text: "Added `clientCtaLocation` and `workflowLoadCompleted` optional property as part of Cancel event from the SDK."
      - text: "Various performance improvements and bug fixes."

  - version: 4.22.9
    date: 2025-03-12
    changes:
      - text: "Added support for [Firefly Custom Models](../concepts/generate-image-v2.md#custom-firefly-models) in the new Generate Image V2 experience (Enterprise users only). When enabled, a Custom Firefly Models dropdown will appear above all other generation options, allowing you to select the desired model."

  - version: 4.21.17
    date: 2025-02-27
    changes:
      - text: |
          [**`CCEverywhere.TextToImageAppConfig.appVersion`**](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#properties): Introduced a new enhanced UI in the Generate Image Module, configurable using `appVersion` in `AppConfig`.
            - When set to `"2"`, users can access the updated interface and features.
            - By default, this property is set to `"1"`, displaying the older experience.

          **Key Features:**
      - text: "**Enhanced User Interface**: Redesigned with a new Carousel and Grid view."
      - text: "**Community Wall**: An endless collection of generated images with prompts for users to select from."
      - text: "**Fast Mode**: Generates images faster with lesser details, suitable for simple topics, backgrounds, illustrations, and close portraits."
      - text: "**Improved Prompt Bar**: Includes prompt suggestions for a better user experience."
      - text: "**Rich Previews**: Provides a more interactive and engaging preview experience."
      - text: |
          **And more!**

          **Configurations available in `CCEverywhere` after enabling the new UI:**
      - text: "[`TextToImageAppConfig.thumbnailOptions`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#properties): Options to be displayed on the thumbnail."
      - text: "[`TextToImageAppConfig.editDropdownOptions`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#properties): Options for the Edit dropdown."
      - text: "[`TextToImageAppConfig.publishConfig`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#properties): Configuration for the Publish action."
      - text: "[`TextToImageAppConfig.fastModeConfig`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#properties): Configuration for enabling or disabling fast mode default state."
      - text: "[`TextToImageAppConfig.featureConfig`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#properties): Configuration for enabling or disabling specific features."
      - text: "Added a new [Concept Guide](../concepts/generate-image-v2.md) for Generate Image V2, detailing all the features of the new version and providing examples on how to enable each feature."
      - text: "Updated the [Demo App](https://demo.expressembed.com/) to showcase the Generate Image V2 feature. To use the new feature:"
      - text: "Navigate to **Generative** -> **Generate image** -> **Next**"
      - text: |
          In the Configuration options, Select generate image version as V2.

          [![Demo App](./images/demo-app.png)](https://demo.expressembed.com/)
      - text: "Select all the options you need and click **Create with Adobe Express**"
      - text: "Added support for `pdfPrint` in `allowedExportFileTypes` to `appConfig` in addition to the existing `allowedFileTypes`."
      - text: "Fixed loader CSS for frictionless experience."

