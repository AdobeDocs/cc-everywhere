    changes:
      - text: "[`CCEverywhere.appConfig.imageStyleReference`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#properties): in a `createImageFromText()` module, assets can be passed as style reference from host application via `appConfig`."
      - text: "[`CCEverywhere.appConfig.imageCompositionReference`](../../v4/shared/src/types/module/app-config-types/interfaces/text-to-image-app-config.md#properties): in a `createImageFromText()` module, assets can be passed as composition reference from host application via `appConfig`."
      - text: "Video Quick Action: Animate from Audio Iframe was not allowing microphone access."

  - version: 4.15.19
    date: 2024-10-09
    changes:
      - text: "Redesigned the entire [SDK Reference](../../v4/index.md) section, providing full APIs coverage."
      - text: "Added a V3 to V4 [Migration Guide](../concepts/migration-v3-v4.md)."
      - text: "`CCEverywhere.ExportConfig.ENABLED_BUTTON`: Added a new style in export option, any button can be made always enabled from the launch of the iframe by passing `uiType:enabled-button`"
      - text: "`CCEverywhere.ExportConfig.DOWNLOAD_ALL`: Added Export options target as `\"Download_all\"` to download all the images, applicable only for text to image."
      - text: "`CCEverywhere.createImageFromText.appConfig.imageDimensions`: In the `appConfig` of `createImageFromText`, included `imageDimensions` to define the dimensions for the images users can generate. This parameter accepts the size in pixels and the corresponding aspect ratio. When specified, users will be limited to generating images to the provided aspect ratio."

  - version: 4.14.23
    date: 2024-09-23
    changes:
      - text: "Redesigned the Information Architecture, to make it easier for developers to find the information they need."
      - text: "Updated the [Submission and Review](../review/index.md) and [Quickstart](../quickstart/index.md) Guides."
      - text: "Added a new [Tutorials](../tutorials/index.md) section with two tutorials."

  - version: 4.14.23
    date: 2024-09-05
    changes:
      - text: "Added support for Blobs to the list of supported data types for an Asset in `DocConfig`. Clients can now pass a blob or file object in place of `base64` or `url`."

  - version: 4.4.15
    date: 2024-04-02
    changes:
      - text: "`CCEverywhere.terminate`: We have added the terminate API to SDK v4. Once it is called, performing any action should fail with error SDK_NOT_INITIALIZED unless SDK is initialized again."
      - text: "Added [z-index](../../reference/types/index.md#containerconfig) support for the root container."

  - version: 4.2.30
    date: 2024-03-14
    changes:
      - text: "`callbacks` are no longer set in the `initialize` method"
      - text: "Every API now accepts `appConfig`. Callbacks are now part of `appConfig`."

  - version: 4.2.29
    date: 2024-03-14
    changes:
      - text: "`callbacks` are now set in the `initialize` method"
      - text: "`ExportOptions` has changed and new \"continue editing\" buttons are available"
      - text: "`ccEverywhere.createDesign()` has now been broken into `ccEverywhere.editor.create()` and `ccEverywhere.editor.createWithAsset()`"
      - text: "`ccEverywhere.editDesign()` is now `ccEverywhere.editor.edit()`"
      - text: "`ccEverywhere.openQuickAction()` is now `ccEverywhere.quickAction.convertToJPEG()` (each of the different actions has its own API now)"
      - text: |
          We have added modules to the SDK. Modules are contextual mini-editing experiences. We currently offer:
            - Generate Image module: `ccEverywhere.module.createImageFromText()`
            - Edit Image module: `ccEverywhere.module.editImage()`
      - text: "Delayed login is now available."

  - version: 3.10.13
    date: 2023-11-06
    changes:
      - text: |
          [CreateInputParams.canvasSize](../../reference/types/index.md#canvasaspectid): Added support for new layouts.
             - NoteHeaderImage
             - LineAdSmall
             - LineAdSquare
             - LineAdVertical
             - LineRichMenuLarge
             - LineRichMenuSmall
             - LineRichMessage
      - text: |
          [CreateInputParams.templateType](../../reference/types/index.md#templatetype): Added support for some template types.
             - note-header-image
             - line-ad-small
             - line-ad-square
             - line-ad-vertical
             - line-rich-menu-large
             - line-rich-menu-small
             - line-rich-message
      - text: "Generate QR Code: This new image quick action allows users to create custom QR code for any given URL. The quick action id for this is 'generate-qr-code'. We support Save to Host and Download options for the asset."
      - text: "Caption With Video: This new video quick action allows users to add captions to their videos. Users can upload videos with audio tracks and captions will be generated by Adobe Express. Does not work on videos which do not have any voiceover. The quick action id for this is 'caption-video'."

  - version: 3.8.11
    date: 2023-08-25
    changes:
      - text: "`ConfigParams.skipBrowserSupportCheck`: By default, this property is set to false and users will encounter an \"Unsupported Browser\" page when launching a design flow. When this property is configured to true and the browser is not supported, calling `initialize()` will **not** result in an error."

  - version: 3.7.14
    date: 2023-08-15
    changes:
      - text: "ExportButton.accent: The variant option 'cta' has been replaced with 'accent'. Both 'cta' and 'accent' work the same but the support for 'cta' is deprecated as per Spectrum guidelines."
      - text: "We will not support the following two quick actions: Reverse Video and Change Speed"
      - text: "Added a new video quick action: Animate From Audio. This allows users to create a character animation by choosing a character from the given list of characters, adding a backdrop and then recording a speech."
      - text: "ExportButton.id is now a required property on native buttons"

  - version: 3.6.16
    date: 2023-08-06
    changes:
      - text: "CreateOutputParams.allowedFileTypes: We now support the following four file types: image/png, image/jpeg, application/pdf and video/mp4. Client apps will now be able to restrict the export options shown to end users by passing the relevant file type in allowedFileTypes property. This is also relevant of mixed media."
      - text: "EditOutputParams.allowedFileTypes: We now support the following four file types: image/png, image/jpeg, application/pdf and video/mp4. Client apps will now be able to restrict the export options shown to end users by passing the relevant file type in allowedFileTypes property. This is also relevant of mixed media."
      - text: "Video Export: Users will now be able to export assets as MP4 files. In order to do this, there must be a video asset added in the canvas to see the option in the export options dropdown for custom buttons. Pass video/mp4 option in allowedFileTypes."
      - text: "Mixed Media Support: Users will be able to download mixed media assets. In case they have added an image in one page and video in another, they will now be able to see JPG + MP4 or PNG + MP4 in the export options dropdown for custom buttons.Pass image/jpeg, image/png and video/mp4 option in allowedFileTypes."

  - version: 2.0.8
    date: 2023-02-02
    changes:
      - text: "Browser compatibility checker: Now the SDK will check for browser compatibility during initialization."
      - text: "New default method `terminate()` allows you to terminate an active instance of CCEverywhere. This method will return false if there is no active CCEverywhere instance."
      - text: |
          Google YOLO will work for both the full editor and quick actions. If the user is not signed in, the YOLO prompt will be shown to users. If the user has multiple Google accounts, they can select from a list.
            - If the user has an Adobe account associated with Google ID, the user is signed in.
            - If the user does not have an Adobe account associated with the Google ID, a new Adobe account will be created for the user using their Google ID.
            - User can choose to dismiss the YOLO modal and continue with delayed login.
            - Redirect URI is no longer being used.
      - text: "`initialize()` method is now async. This is the main API used for initializing the SDK. It will return a promise with a CCEverywhere object which can be used to call other APIs in the SDK."

  - version: 1.5.4
    date: 2022-12-16
    changes:
      - text: "Enabled \"Logged Out\" experience for image and video quick actions"
      - text: "Fixed the problem with the editor iFrame not auto-closing post publish (for the scenario when the editor is launched from image quick actions via \"Customize in Express\" workflow)"
      - text: "Fixed an issue related to pre-caching of resources for the editor"
      - text: "Currently, the \"Customize in Express\" workflow from the \"Remove Background\" image quick action is not working. The fix will be deployed in a future version."

  - version: 1.4.10
    date: 2022-11-14
    changes:
      - text: |
          Delayed Login experience in the full editor.
            - With this release of the SDK, we are enabling users to launch the full editor without having to log in first. The user can sign in 1) once the Adobe Express iFrame launches, or 2) continue to work on the document until they decide to publish/save -- at which point they would be prompted to sign in. The delayed login experience is available out-of-the-box with this version of the SDK and developers do not have to make any changes to enable this experience.
      - text: |
          "Create from Image" workflow.
            - Users can now create from an image instead of a blank canvas. This workflow works with the delayed login experience. To use this workflow, partners will need to enable the host application to use it.

  - version: 1.3.11
    date: 2022-08-24
    changes:
      - text: "SDK bundled for browsers, hosted on Adobe CDN."
      - text: "Welcome Screen before the Single User Sign In screen appears."
      - text: "Ability to log out from the full editor loaded in the iFrame."
      - text: "Signing-in from the welcome screen, subsequent to a sign-out, successfully launches the full editor iFrame."
      - text: "Opening asset in the full editor, subsequent to performing an image quick action, and saving the asset doesn't close the iFrame automatically. This will be fixed in the next release."
      - text: "When a quick action is performed and the resulting asset is opened in a full editor: after the user makes changes and saves it the asset is saved outside of the designated project folder in the user's Adobe Express account."

  - version: 1.1.0
    date: 2022-04-09
    changes:
      - text: "Scrim view background color is now configurable."
      - text: "Redirect URI can now be provided as input during initialization."
      - text: "`appVersion` and `platformCategory` are now optional arguments."
      - text: "In dev environments, SDK is now able to read and override the base URL from the client's window object."
      - text: "API provided to easily identify the SDK version running in browser or host apps."
      - text: "Update Content will now be displayed in 100% of the area of the client div, instead of appearing with scrollbars."
      - text: "Adobe IMS related enhancements."
      - text: "When `parentElementId` is supplied, the dimensions of the parent container display Scrim view instead of Viewport."
      - text: "QA loader screen can be now set to the darkest theme."
      - text: "iFrame now loads successfully on Safari even if pop-up blocker settings are enabled."
      - text: "Enhanced error handling for failure to launch iFrame for quick action and full editor."
      - text: "Full editor iFrame now honoring 0 border radius value."
