<svg xmlns="http://www.w3.org/2000/svg" width="912" height="418" viewBox="0 0 912 418" role="img" aria-labelledby="title description">
  <title id="title">Partner Auth token flow</title>
  <desc id="description">In the browser, the Adobe Express Embed SDK invokes the registered clientAuthProvider callback. The callback sends GET /api/token to the partner backend. If there is no reusable cached token, the backend uses its OAuth server-to-server credential to request a token from Adobe IMS, which returns the access token and its lifetime. The backend returns the token, reported expiry timestamp, and app user GUID to the callback. The callback resolves with ClientAuthDetails for the SDK.</desc>

  <defs>
    <marker id="request-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#161616"/>
    </marker>
    <marker id="response-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="912" height="418" rx="16" fill="#fff"/>
  <g font-family="Adobe Clean, Helvetica Neue, Arial, sans-serif" fill="#161616">
    <text x="24" y="40" font-size="27" font-weight="700" letter-spacing="-.4">Partner Auth token flow</text>

    <rect x="24" y="63" width="436" height="333" rx="14" fill="#f8f8f8" stroke="#d7d7d7"/>
    <text x="38" y="85" font-size="13" font-weight="700" fill="#404040">Browser</text>

    <g stroke="#a9a9a9" stroke-width="1" stroke-dasharray="3 4">
      <path d="M134 146V381 M350 146V381 M568 146V381 M786 146V381"/>
    </g>

    <g fill="#fff" stroke="#bdbdbd">
      <rect x="38" y="96" width="192" height="50" rx="8"/>
      <rect x="254" y="96" width="192" height="50" rx="8" stroke="#7155fa" stroke-width="1.5"/>
      <rect x="472" y="96" width="192" height="50" rx="8"/>
      <rect x="690" y="96" width="192" height="50" rx="8"/>
    </g>

    <g text-anchor="middle" font-size="14.5" font-weight="700">
      <text x="134" y="126" font-size="13">Adobe Express Embed SDK</text>
      <text x="350" y="117">Provider callback</text>
      <text x="568" y="117">Partner backend</text>
      <text x="786" y="117">Adobe IMS</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#404040">
      <text x="350" y="134" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">clientAuthProvider()</text>
      <text x="568" y="134">Caches IMS tokens</text>
      <text x="786" y="134">OAuth token endpoint</text>
    </g>

    <g fill="none" stroke="#161616" stroke-width="1.6" marker-end="url(#request-arrow)">
      <path d="M134 185H349"/>
      <path d="M350 221H567"/>
      <path d="M568 267H785"/>
    </g>
    <g fill="none" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#response-arrow)">
      <path d="M786 303H569"/>
      <path d="M568 339H351"/>
      <path d="M350 375H135"/>
    </g>

    <g text-anchor="middle" font-size="13.5">
      <text x="242" y="175">Invoke callback</text>
      <text x="459" y="211" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">GET /api/token</text>
      <text x="677" y="242">If no reusable token is cached</text>
      <text x="677" y="258">Exchange server credentials</text>
      <text x="677" y="293">Access token and lifetime</text>
      <text x="459" y="329">Token, expiry, and user GUID</text>
      <text x="242" y="365">Return <tspan font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">ClientAuthDetails</tspan></text>
    </g>
  </g>
</svg>
