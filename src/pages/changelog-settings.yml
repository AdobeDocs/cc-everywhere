# releases-metadata.yml
# Manually maintained metadata for the Adobe Express Embed SDK changelog.
# Keep year, month, and version options synchronized with releases.yml.
# Add only options that have matching release data; remove stale options.

page:
  title: "Changelog"
  description: "Adobe Express Embed SDK releases and documentation updates"
  url: "https://raw.githubusercontent.com/AdobeDocs/cc-everywhere/refs/heads/main/src/pages/feed.xml"

kinds:
  sdk: "SDK release"
  docs: "Docs update"
  maintenance: "Maintenance"

archive:
  enabled: true
  label: "Older releases"
  description: "Previously released versions"

  groups:
    - id: "sdk-v1-v3"
      label: "SDK v1–v3"
      applies_to:
        kind: sdk
        version_range: "<4.0.0"
      hint: "Releases before v4 aren't tagged by module or type."

    - id: "old-maintenance"
      label: "Older maintenance releases"
      applies_to:
        kind: maintenance
        version_range: "<2.0.0"
      hint: "Historical maintenance releases."

filters:
  - id: module
    label: "Module"
    control: select
    allLabel: "All modules"
    field: areas
    options:
      - id: editor
        label: "Full Editor"
      - id: ede
        label: "Embedded Design Editor"
      - id: templates
        label: "Template Browser"
      - id: generate
        label: "Generate Image"
      - id: editimage
        label: "Edit Image"
      - id: viewer
        label: "Design Viewer"
      - id: qa
        label: "Quick Actions"
      - id: auth
        label: "Authentication"
      - id: export
        label: "Export & publish"
      - id: core
        label: "SDK core & config"

  - id: year
    label: "Year"
    allLabel: "All years"
    options:
      - "2026"
      - "2025"
      - "2024"

  - id: month
    label: "Month"
    allLabel: "All months"
    # Month names are listed directly; include only months with releases for that year.
    optionsByYear:
      "2026":
        - "October"
        - "September"
        - "August"
        - "July"
        - "June"
        - "April"
        - "March"
        - "January"
      "2025":
        - "November"
        - "October"
        - "September"
        - "August"
        - "June"
        - "May"
        - "April"
        - "March"
        - "February"
        - "January"
      "2024":
        - "December"
        - "November"
        - "October"
        - "September"
        - "April"
        - "March"
