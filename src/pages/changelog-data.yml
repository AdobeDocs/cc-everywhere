# releases.yml
# Source of truth for the Adobe Express Embed SDK changelog.
# The changelog page and its filters are generated from this file. Newest release first.
#
# Release fields
#   version   SDK version. Leave out for docs updates that ship without a version.
#   date      Release date, YYYY-MM-DD.
#   kind      sdk | docs | maintenance
#   title     Optional headline for a major release.
#   changes   List of changes. Maintenance releases can leave it out.
#   summary   Pre-v4 releases only: one Markdown line instead of tagged changes.
#   breaking  Pre-v4 releases only: true if the release has breaking changes.
#
# Change fields
#   type      breaking | removed | deprecated | new | improved | fixed | docs
#   modules   One or more module IDs from the list below.
#   text      What changed, in Markdown. Links are relative to the changelog page.
#   action    What partners need to do. Required for breaking, removed, and deprecated.
#   open      true while a known issue is unresolved. Shows a "Still open" tag.

# Module IDs and the names shown in the Module filter.
modules:
  editor: Full Editor
  ede: Embedded Design Editor
  templates: Template Browser
  generate: Generate Image
  editimage: Edit Image
  viewer: Design Viewer
  qa: Quick Actions
  auth: Authentication
  export: Export & publish
  core: SDK core & config

